<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Recording - Recast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="min-h-screen p-6 flex items-center justify-center">
    <div class="max-w-2xl w-full">
        <div class="mb-6">
            <a href="/" class="text-white hover:text-purple-100 transition">← Back to Dashboard</a>
        </div>

        <div class="card p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-6">Schedule New Recording</h1>

            <form id="schedule-form" class="space-y-6">
                <!-- URL Input -->
                <div>
                    <label for="url" class="block text-sm font-semibold text-gray-700 mb-2">
                        Video URL
                    </label>
                    <input 
                        type="url" 
                        id="url" 
                        name="url" 
                        required
                        placeholder="https://example.com/video"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    >
                    <p class="text-sm text-gray-500 mt-1">Enter the URL of the video stream to record</p>
                </div>

                <!-- Optional Title -->
                <div>
                    <label for="title" class="block text-sm font-semibold text-gray-700 mb-2">
                        Title (optional)
                    </label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        maxlength="200"
                        placeholder="e.g., Live Event 12/3/2025"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    >
                    <p class="text-sm text-gray-500 mt-1">Shown in the dashboard if provided.</p>
                </div>

                <!-- Browser Controller Selection -->
                <div>
                    <label for="browser_controller" class="block text-sm font-semibold text-gray-700 mb-2">
                        Browser Controller
                    </label>
                    <select 
                        id="browser_controller" 
                        name="browser_controller" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    >
                        <option value="">Loading controllers...</option>
                    </select>
                    <p class="text-sm text-gray-500 mt-1">Select the browser automation script for this site</p>
                </div>

                <!-- Start Time -->
                <div>
                    <label for="start_time" class="block text-sm font-semibold text-gray-700 mb-2">
                        Start Time
                    </label>
                    <input 
                        type="datetime-local" 
                        id="start_time" 
                        name="start_time" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    >
                    <p class="text-sm text-gray-500 mt-1">When should the recording start?</p>
                </div>

                <!-- End Time -->
                <div>
                    <label for="end_time" class="block text-sm font-semibold text-gray-700 mb-2">
                        End Time
                    </label>
                    <input 
                        type="datetime-local" 
                        id="end_time" 
                        name="end_time" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                    >
                    <p class="text-sm text-gray-500 mt-1">When should the recording end?</p>
                </div>

                <!-- Duration Display -->
                <div id="duration-display" class="bg-blue-50 border border-blue-200 rounded-lg p-4 hidden">
                    <p class="text-sm font-semibold text-blue-800">Recording Duration:</p>
                    <p id="duration-text" class="text-2xl font-bold text-blue-900 mt-1"></p>
                </div>

                <!-- Quick Duration Buttons -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Quick Duration Presets
                    </label>
                    <div class="grid grid-cols-4 gap-2">
                        <button type="button" onclick="setDuration(30)" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium">
                            30 min
                        </button>
                        <button type="button" onclick="setDuration(60)" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium">
                            1 hour
                        </button>
                        <button type="button" onclick="setDuration(120)" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium">
                            2 hours
                        </button>
                        <button type="button" onclick="setDuration(180)" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm font-medium">
                            3 hours
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button 
                        type="submit" 
                        class="w-full bg-purple-600 text-white py-4 rounded-lg font-bold text-lg hover:bg-purple-700 transition shadow-lg"
                    >
                        Schedule Recording
                    </button>
                </div>
            </form>

            <!-- Success/Error Messages -->
            <div id="message-container" class="mt-6 hidden">
                <div id="message" class="p-4 rounded-lg"></div>
            </div>
        </div>
    </div>
</div>

<script>
// Load available browser controllers
async function loadBrowserControllers() {
    try {
        const response = await fetch('/api/browser_controllers');
        const data = await response.json();
        const select = document.getElementById('browser_controller');
        
        select.innerHTML = data.controllers.map(controller => `
            <option value="${controller.id}">${controller.name} - ${controller.description}</option>
        `).join('');
        
        // Set default to generic
        select.value = 'generic';
    } catch (error) {
        console.error('Error loading browser controllers:', error);
        document.getElementById('browser_controller').innerHTML = '<option value="generic">Generic (fallback)</option>';
    }
}

// Load controllers on page load
loadBrowserControllers();

// Set default start time to now
const now = new Date();
now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
document.getElementById('start_time').value = now.toISOString().slice(0, 16);

// Set default end time to 1 hour from now
const oneHourLater = new Date(now.getTime() + 60 * 60 * 1000);
document.getElementById('end_time').value = oneHourLater.toISOString().slice(0, 16);

// Update duration display when times change
function updateDuration() {
    const startTime = document.getElementById('start_time').value;
    const endTime = document.getElementById('end_time').value;
    
    if (startTime && endTime) {
        const start = new Date(startTime);
        const end = new Date(endTime);
        const diffMs = end - start;
        
        if (diffMs > 0) {
            const diffMinutes = Math.floor(diffMs / 60000);
            const hours = Math.floor(diffMinutes / 60);
            const minutes = diffMinutes % 60;
            
            let durationText = '';
            if (hours > 0) {
                durationText += `${hours} hour${hours > 1 ? 's' : ''}`;
            }
            if (minutes > 0) {
                if (hours > 0) durationText += ' ';
                durationText += `${minutes} minute${minutes > 1 ? 's' : ''}`;
            }
            
            document.getElementById('duration-text').textContent = durationText;
            document.getElementById('duration-display').classList.remove('hidden');
        } else {
            document.getElementById('duration-display').classList.add('hidden');
        }
    }
}

document.getElementById('start_time').addEventListener('change', updateDuration);
document.getElementById('end_time').addEventListener('change', updateDuration);

// Quick duration buttons
function setDuration(minutes) {
    const startTime = document.getElementById('start_time').value;
    if (!startTime) {
        alert('Please set a start time first');
        return;
    }
    
    const start = new Date(startTime);
    const end = new Date(start.getTime() + minutes * 60000);
    end.setMinutes(end.getMinutes() - end.getTimezoneOffset());
    document.getElementById('end_time').value = end.toISOString().slice(0, 16);
    updateDuration();
}

// Form submission
document.getElementById('schedule-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = {
        url: document.getElementById('url').value,
        title: document.getElementById('title').value,
        start_time: document.getElementById('start_time').value,
        end_time: document.getElementById('end_time').value,
        browser_controller: document.getElementById('browser_controller').value
    };
    
    try {
        const response = await fetch('/api/schedule_job', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        });
        
        const data = await response.json();
        const messageContainer = document.getElementById('message-container');
        const message = document.getElementById('message');
        
        messageContainer.classList.remove('hidden');
        
        if (data.status === 'success') {
            message.className = 'p-4 rounded-lg bg-green-100 border border-green-300 text-green-800';
            message.innerHTML = `
                <p class="font-bold mb-1">✓ Recording Scheduled Successfully!</p>
                <p class="text-sm">Job ID: ${data.job_id}</p>
                <p class="text-sm mt-2">
                    <a href="/" class="underline hover:text-green-900">Return to Dashboard</a>
                </p>
            `;
            
            // Reset form
            document.getElementById('schedule-form').reset();
            
            // Redirect after 3 seconds
            setTimeout(() => {
                window.location.href = '/';
            }, 3000);
        } else {
            message.className = 'p-4 rounded-lg bg-red-100 border border-red-300 text-red-800';
            message.innerHTML = `
                <p class="font-bold mb-1">✗ Error</p>
                <p class="text-sm">${data.message}</p>
            `;
        }
    } catch (error) {
        const messageContainer = document.getElementById('message-container');
        const message = document.getElementById('message');
        
        messageContainer.classList.remove('hidden');
        message.className = 'p-4 rounded-lg bg-red-100 border border-red-300 text-red-800';
        message.innerHTML = `
            <p class="font-bold mb-1">✗ Network Error</p>
            <p class="text-sm">${error.message}</p>
        `;
    }
});

// Initial duration calculation
updateDuration();
</script>

</body>
</html>
